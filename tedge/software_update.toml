operation = "software_update"

[init]
action = "proceed"
on_success = "executing"

[executing]
action = "proceed"
on_success = "check-test-nginx"

# Not required at the moment
# [check-test-nginx]
# script = "/etc/tedge/scripts/manage-update.sh check test-nginx ${.payload.updateList}"
# on_exit.0 = "process"
# on_exit.1 = "check"
# on_exit._ = "failed"

[check]
script = "sudo -E tedge-container self check ${.payload.updateList}"
on_exit.0 = "container_self_update"
on_exit.1 = "process"
on_exit._ = "failed"

[container_self_update]
# Optional step where a self-update is performed
operation = "self_update"
input.image = "${.payload.image}"
input.containerName = "${.payload.containerName}"
on_exec = "await-self-update"

[await-self-update]
action = "await-operation-completion"
on_success = "process"

[process]
operation = "builtin:software_update"
on_exec = "wait-for-update"

[wait-for-update]
action = "await-operation-completion"
on_success = "trigger-restart"
on_kill = ""

# Trigger restart externally by writing to /local-conf/update-test-nginx.cfg
# Then service unit business-container-restart.path watches this file on the host and restarts business-container.service
[trigger-restart]
script = "/etc/tedge/scripts/manage-update.sh restart test-nginx ${.payload.updateList}"
on_success = "successful"

[successful]
action = "cleanup"

[failed]
action = "cleanup"